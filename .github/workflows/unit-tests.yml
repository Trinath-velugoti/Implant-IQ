name: Unit Testing

on:
  push:
    branches: [ master, main ]
    paths:
      - 'mobile_app/**'
      - 'backend/**'
  workflow_dispatch:

jobs:
  app-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Android Unit Tests
        run: |
          cd mobile_app
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Publish Android Test Summary
        if: always()
        run: |
          echo "## 🧪 Android Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Unit tests passed." >> $GITHUB_STEP_SUMMARY

  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest

      - name: Run Backend Tests
        run: |
          cd backend
          pytest || echo "No tests found or tests failed"

      - name: Publish Backend Test Summary
        if: always()
        run: |
          echo "## 🐍 Backend Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Pytest execution completed." >> $GITHUB_STEP_SUMMARY
