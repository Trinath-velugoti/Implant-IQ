name: Android E2E Automation

on:
  push:
    branches: [ master, main ]
    paths:
      - 'mobile_app/**'
      - 'app_e2e/**'
  workflow_dispatch:

jobs:
  android-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Debug APK
        run: |
          cd mobile_app
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install E2E Dependencies
        run: |
          cd app_e2e
          npm init -y
          npm install @wdio/cli @wdio/local-runner @wdio/mocha-framework @wdio/spec-reporter appium appium-uiautomator2-driver exceljs

      - name: Run Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: bash app_e2e/scripts/ci_run_tests.sh
        env:
          APK_PATH: mobile_app/build/outputs/apk/debug/app-debug.apk

      - name: Generate Summary
        run: node app_e2e/utils/generateSummary.js
        if: always()
