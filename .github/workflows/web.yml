name: Web CI/CD & Deploy to GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
      - name: Summary
        run: |
          echo "# 🚀 Web Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "## Status: LIVE" >> $GITHUB_STEP_SUMMARY
          echo "Your professional AI dashboard has been deployed to the clinical cloud." >> $GITHUB_STEP_SUMMARY
