name: Security & Validation Review

on:
  push:
    branches: [ master, main ]
    paths:
      - 'backend/**'
      - 'web/**'
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install exceljs

      - name: Run Web Security Scan
        run: node web/scripts/generateWebSecuritySuite.js
        env:
          NODE_PATH: ./node_modules

      - name: Run Backend Security Scan
        run: node backend/scripts/generateSecuritySuite.js
        env:
          NODE_PATH: ./node_modules

      - name: Publish Security Summary
        run: |
          cat Test_Results/Security/web-executive-summary.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat Test_Results/Security/backend-executive-summary.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat Test_Results/Security/web-security-review.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat Test_Results/Security/backend-security-review.md >> $GITHUB_STEP_SUMMARY

      - name: Enforce Zero Critical Policy
        run: |
          if grep -q "Critical: [1-9]" Test_Results/Security/*.md; then
            echo "Security check failed: Critical vulnerabilities detected!"
            exit 1
          fi
