name: API Load Test

on:
  push:
    branches: [ master, main ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install flask flask-cors mysql-connector-python joblib scikit-learn

      - name: Start Mock Backend
        run: |
          cd backend
          python mock_app.py &
          sleep 5

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Load Test
        run: k6 run --summary-export=summary.json backend/scripts/load-test.js
        env:
          BACKEND_URL: "http://127.0.0.1:8080/api/stats"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse and Publish Results
        run: node backend/scripts/parseK6Summary.js
