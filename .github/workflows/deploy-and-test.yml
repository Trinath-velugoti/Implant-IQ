name: Web E2E & Deployment

on:
  push:
    branches: [ master, main ]
    paths:
      - 'web/**'
      - 'web_e2e/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        run: |
          cd web
          npm install

      - name: Install E2E Dependencies
        run: |
          cd web_e2e
          npm init -y
          npm install mocha selenium-webdriver exceljs

      - name: Build Web App
        run: |
          cd web
          npm run build || echo "Build failed or not configured, skipping..."

      - name: Start Vite Preview
        run: |
          cd web
          npx vite preview --port 5173 --host 127.0.0.1 --base /Implant-IQ/ &
          sleep 5

      - name: Run Selenium Tests
        run: |
          cd web_e2e
          export TEST_BASE_URL="http://127.0.0.1:5173/Implant-IQ"
          npx mocha tests/mega_web_1100.test.js --reporter utils/excelReporter.js
        continue-on-error: true

      - name: Prepare Reports for Deployment
        run: |
          mkdir -p web/dist/reports/latest
          mkdir -p web/dist/reports/history/build-${{ github.run_number }}
          cp Test_Results/HTML/execution-report.html web/dist/reports/latest/
          cp Test_Results/HTML/execution-report.html web/dist/reports/history/build-${{ github.run_number }}/
          cp Test_Results/Excel/selenium-report.xlsx web/dist/reports/latest/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/dist'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Post Summary
        run: |
          echo "## 🧪 Web E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests executed successfully." >> $GITHUB_STEP_SUMMARY
          echo "[View Live HTML Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/latest/execution-report.html)" >> $GITHUB_STEP_SUMMARY
