name: Web E2E & Deployment

on:
  push:
    branches: [ master, main ]
    paths:
      - 'web/**'
      - 'web_e2e/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install E2E Dependencies
        run: |
          cd web_e2e
          npm init -y
          npm install mocha selenium-webdriver exceljs

      - name: Start Static Server
        run: |
          npm install -g serve
          npx serve web --port 5173 &
          sleep 5

      - name: Run Selenium Tests
        run: |
          cd web_e2e
          export TEST_BASE_URL="http://127.0.0.1:5173"
          npx mocha tests/mega_web_1100.test.js --reporter utils/excelReporter.js
        continue-on-error: true

      - name: Prepare Reports for Deployment
        run: |
          mkdir -p web/reports/latest
          mkdir -p web/reports/history/build-${{ github.run_number }}
          if [ -f web_e2e/Test_Results/HTML/execution-report.html ]; then
            cp web_e2e/Test_Results/HTML/execution-report.html web/reports/latest/index.html
            cp web_e2e/Test_Results/HTML/execution-report.html web/reports/history/build-${{ github.run_number }}/index.html
            cp web_e2e/Test_Results/Excel/selenium-report.xlsx web/reports/latest/ || true
          else
            echo "<html><body><h1>Report Generation in Progress</h1><p>Tests are still running or failed to output. Please check the Actions log.</p></body></html>" > web/reports/latest/index.html
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Post Summary
        run: |
          echo "## 🧪 Web E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests executed successfully." >> $GITHUB_STEP_SUMMARY
          echo "[View Live HTML Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/latest/)" >> $GITHUB_STEP_SUMMARY
